[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-process-agent"
version = "0.1.0"
description = "Teaching-oriented LangGraph agent example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-openai",
  "langchain-core",
  "langgraph",
  "pydantic>=2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
